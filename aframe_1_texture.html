<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>

    <body>
        <a-scene>         
            <a-assets>
                <img id="texture" src="./assets/images/grass.jpg">
                
            </a-assets>
            <a-box src="#texture" position="-2 1 -4"></a-box>
            <a-box src="#texture" position="-1 1 -4"></a-box>
            <a-box src="#texture" position="-2 2 -4"></a-box>
            <a-box src="#texture" position="-2 1 -3"></a-box>
            <a-box src="#texture" position="-2 0 -4"></a-box>
        </a-scene>
    </body>
</html>
