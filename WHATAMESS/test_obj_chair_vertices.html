<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <!-- <script src="./debug.js"></script> -->
    <script src="https://ensaama-officiel-numerique.github.io/components/debug/debug.js"></script>
    <!-- <script src="./effects-vertices.js"></script> -->
    <script src="https://ensaama-officiel-numerique.github.io/components/effects/test3_notoggle/effects-vertices.js"></script>
</head>

<body>
    <a-scene background="color: skyblue" 
        debug-keyboard="key:  g, h, j, k, l, m, n, b; 
            event: vertices, vertices-desappear, vertices-falling, vertices-glitch, 
            vertices-corrupt, vertices-scatter, vertices-binary-rain, vertices-erosion; 
            target: #chair, #chair, #chair, #chair, #chair, #chair, #chair, #chair">
        <a-assets>
            <a-asset-item id="model-obj" src="./assets/3D_models/obj_chair/Wooden_Chair.obj"></a-asset-item>
            <a-asset-item id="model-mtl" src="./assets/3D_models/obj_chair/Wooden_Chair.mtl"></a-asset-item>
            <img id="sky" src="assets/3D_models/image/jsp.jpg">
        </a-assets>


        <a-sky src="#sky"></a-sky>
        


        <a-entity id="chair" obj-model="obj: #model-obj; mtl: #model-mtl" 
            vertices="color: white; radius: 1; opacity: 0.2; ratio: 0.03"
            vertices-desappear="step: 1; min: 0.2; duration: 3000"
            vertices-falling="duration: 3000; destroy: false"
            vertices-glitch="amplitude: 1; duration: 1000; frequency: 60"
            vertices-corrupt="percentage: 0.3; amplitude: 20"
            vertices-scatter="duration: 2000; height: 50; spread: 30; destroy: true;"
            vertices-binary-rain="ratio: 0.01; size: 20; color: #00ff00; distance: 30; duration: 2000; lifetime: 6000"
            vertices-erosion="duration: 5000; percentage: 0.4; jitter: 0.3"
            position="0 0 -5" scale="0.02 0.02 0.02"></a-entity>

        <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="silver"></a-plane>    
    </a-scene>

</body>

</html>
