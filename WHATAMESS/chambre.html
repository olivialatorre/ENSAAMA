  <script>
  AFRAME.registerComponent('glitch-clone', {
    schema: {
      interval: { default: 100 },
      max: { default: 10 },
      offset: { type: 'vec3', default: { x: 0.5, y: 0, z: 0.05 } },
      active: { default: false }
    },
    init: function () {
      this.clones = [];
      this.t = 0;
      this.count = 0;
    },
    tick: function (time, dt) {
      if (!this.data.active || this.count >= this.data.max) return;
      this.t += dt;
      if (this.t < this.data.interval) return;
      this.t = 0;
      this.count++;
      const clone = this.el.cloneNode(true);
      clone.removeAttribute('glitch-clone');
      clone.removeAttribute('id');
      const p = this.el.object3D.position;
      clone.setAttribute('position', {
        x: p.x + this.data.offset.x * this.count,
        y: p.y + this.data.offset.y * this.count,
        z: p.z + this.data.offset.z * this.count
      });
      this.el.parentNode.appendChild(clone);
      this.clones.push(clone);
    },
    remove: function () {
      this.clones.forEach(c => c.parentNode && c.parentNode.removeChild(c));
    }
  });
  
  AFRAME.registerComponent('glitch-clone2', {
    schema: {
      interval: { default: 100 },
      max: { default: 6 },
      offset: { type: 'vec3', default: { x: 0, y: 0.6, z: 0.05 } },

    init: function () {

  AFRAME.registerComponent('poster-flicker', {
  schema: {
    duration:      { default: 30000 },  // durée totale de l'effet (ms)
    startInterval: { default: 900 },    // ms entre deux changements au début
    endInterval:   { default: 30 }      // ms entre deux changements à la fin
  },
  init: function () {
    this.elapsed = 0;
    this.t = 0;
    this.posters = [];
    this.el.querySelectorAll('[src]').forEach((el) => {
      const mesh = el.getObject3D('mesh');
      if (!mesh) return;
      const mat = mesh.material;
      this.posters.push({ mat: mat, map: mat.map });  // on garde l'image d'origine
      mat.map = null;                                  // plus d'image : couleur unie
      mat.needsUpdate = true;
    });
    this.recolor();
  },
  recolor: function () {
    this.posters.forEach((p) => p.mat.color.setHSL(Math.random(), 1, 0.5));
  },
  tick: function (time, dt) {
    this.elapsed += dt;
    this.t += dt;
    const k = Math.min(this.elapsed / this.data.duration, 1);   // 0 → 1 au fil de l'effet
    const interval = this.data.startInterval + (this.data.endInterval - this.data.startInterval) * k;
    if (this.t < interval) return;
    this.t = 0;
    this.recolor();   // chaque poster reçoit sa propre couleur au hasard
  },
  remove: function () {
    // on remet les images et la couleur normale
    this.posters.forEach((p) => {
      p.mat.map = p.map;
      p.mat.color.set('#ffffff');
      p.mat.needsUpdate = true;
    });
  }
});

AFRAME.registerComponent('color-flicker', {
  schema: {
    duration:      { default: 25000 },
    startInterval: { default: 700 },
    endInterval:   { default: 50 },
    mode:          { default: 'each' },    // 'each' ou 'group'
    glow:          { default: true },      // true = ignore complètement les lumières
    stagger:       { default: 0 },         // ms pendant lesquelles les objets s'allument un à un (0 = tous ensemble)
    order:         { default: 'random' }   // 'random' ou 'sequence' (ordre d'écriture dans le HTML)
  },

  init: function () {
    this.elapsed = 0;
    this.t = 0;
    this.groupColor = this.randomColor();
    this.items = [];

    const els = [this.el, ...this.el.querySelectorAll('*')];
    els.forEach((el) => {
      const mesh = el.getObject3D('mesh');
      if (!mesh || !mesh.material) return;
      this.items.push({ mesh: mesh, original: mesh.material, on: false, start: 0 });
    });

    // heure d'allumage de chaque objet
    const n = this.items.length;
    this.items.forEach((it, i) => {
      it.start = this.data.order === 'sequence'
        ? (i / Math.max(n - 1, 1)) * this.data.stagger
        : Math.random() * this.data.stagger;
    });

    this.activateDue();
  },

  randomColor: function () {
    return new THREE.Color().setHSL(Math.random(), 1, 0.5);
  },

  // allume les objets dont l'heure est venue
  activateDue: function () {
    this.items.forEach((it) => {
      if (it.on || this.elapsed < it.start) return;
      it.on = true;
      if (this.data.glow) {
        // matériau qui ne dépend d'aucune lumière ni du brouillard
        it.temp = new THREE.MeshBasicMaterial({ fog: false });
        it.mesh.material = it.temp;
      } else {
        it.color = it.original.color.clone();
        it.map = it.original.map;
        it.original.map = null;
        it.original.needsUpdate = true;
      }
      (it.temp || it.original).color.copy(
        this.data.mode === 'group' ? this.groupColor : this.randomColor()
      );
    });
  },

  recolor: function () {
    this.groupColor = this.randomColor();
    this.items.forEach((it) => {
      if (!it.on) return;   // les objets pas encore allumés restent normaux
      const c = this.data.mode === 'group' ? this.groupColor : this.randomColor();
      (it.temp || it.original).color.copy(c);
    });
  },

  tick: function (time, dt) {
    this.elapsed += dt;
    this.t += dt;
    this.activateDue();

    const k = Math.min(this.elapsed / this.data.duration, 1);
    const interval = this.data.startInterval + (this.data.endInterval - this.data.startInterval) * k;
    if (this.t < interval) return;
    this.t = 0;
    this.recolor();
  },

  remove: function () {
    this.items.forEach((it) => {
      if (!it.on) return;   // jamais allumé : rien à remettre
      if (it.temp) {
        it.mesh.material = it.original;
        it.temp.dispose();
      } else {
        it.original.color.copy(it.color);
        it.original.map = it.map;
        it.original.needsUpdate = true;
      }
    });
  }
});

AFRAME.registerComponent('disintegrate', {
  schema: {
    count:   { default: 400 },    // nombre total de cubes
    size:    { default: 0.04 },   // taille d'un cube (m)
    delay:   { default: 3000 },   // les morceaux se brisent entre 0 et delay (ms)
    order:   { default: 'top' },  // 'top' = de haut en bas, 'random' = au hasard
    gravity: { default: 4 },
    spread:  { default: 0.5 },    // force de l'éjection
    linger:  { default: 1500 },   // ms passées au sol avant de disparaître
    floor:   { default: 0 },      // hauteur du sol
    glow:    { default: false }   // true = cubes visibles même dans le noir
  },

  init: function () {
    const d = this.data;
    this.t = 0;
    this.finished = false;
    this.dummy = new THREE.Object3D();
    this.pieces = [];
    this.cubes = [];

    // 1. les morceaux = tous les objets visibles du groupe
    this.el.object3D.updateMatrixWorld(true);
    const box = new THREE.Box3(), sz = new THREE.Vector3();
    this.el.object3D.traverse((o) => {
      if (!o.isMesh || !o.geometry || !o.visible || Array.isArray(o.material)) return;
      box.setFromObject(o);
      box.getSize(sz);
      this.pieces.push({
        mesh: o, hidden: false, start: 0,
        w: sz.x * sz.y + sz.y * sz.z + sz.x * sz.z + 1e-6,   // surface (pour répartir les cubes)
        top: box.max.y
      });
    });
    if (!this.pieces.length) { this.finished = true; return; }

    // 2. quand chaque morceau se brise
    const tops = this.pieces.map((p) => p.top);
    const hi = Math.max(...tops), lo = Math.min(...tops);
    this.pieces.forEach((p) => {
      p.start = d.order === 'top'
        ? ((hi - p.top) / ((hi - lo) || 1)) * d.delay
        : Math.random() * d.delay;
    });

    // 3. échantillonnage de la couleur d'une image (pour les posters)
    const samplers = new Map();
    const sample = (map, u, v) => {
      let data = samplers.get(map);
      if (data === undefined) {
        try {
          const c = document.createElement('canvas');
          c.width = c.height = 64;
          const ctx = c.getContext('2d');
          ctx.drawImage(map.image, 0, 0, 64, 64);
          data = ctx.getImageData(0, 0, 64, 64).data;
        } catch (e) { data = null; }   // image bloquée : on utilisera la couleur du matériau
        samplers.set(map, data);
      }
      if (!data) return null;
      const x = Math.min(63, Math.floor(u * 64));
      const y = Math.min(63, Math.floor((1 - v) * 64));
      const k = (y * 64 + x) * 4;
      return 'rgb(' + data[k] + ',' + data[k + 1] + ',' + data[k + 2] + ')';
    };

    // 4. création des cubes, répartis dans chaque morceau
    const total = this.pieces.reduce((s, p) => s + p.w, 0);
    this.pieces.forEach((p) => {
      const n = Math.max(3, Math.round(d.count * p.w / total));
      const g = p.mesh.geometry;
      if (!g.boundingBox) g.computeBoundingBox();
      const bb = g.boundingBox;
      const mat = p.mesh.material;
      for (let i = 0; i < n; i++) {
        const u = Math.random(), v = Math.random();
        const lp = new THREE.Vector3(
          bb.min.x + u * (bb.max.x - bb.min.x),
          bb.min.y + v * (bb.max.y - bb.min.y),
          bb.min.z + Math.random() * (bb.max.z - bb.min.z)
        );
        p.mesh.localToWorld(lp);   // position réelle dans la salle

        const color = new THREE.Color(0xffffff);
        if (mat.color) color.copy(mat.color);
        if (mat.map) {
          const rgb = sample(mat.map, u, v);
          if (rgb) color.setStyle(rgb);
        }

        this.cubes.push({
          piece: p, color: color,
          x: lp.x, y: lp.y, z: lp.z,
          vx: (Math.random() - 0.5) * d.spread,
          vy: Math.random() * d.spread * 0.5,
          vz: (Math.random() - 0.5) * d.spread,
          s: d.size * (0.6 + Math.random() * 0.8),
          yaw: Math.random() * Math.PI,
          fall: p.start + Math.random() * 400,   // chaque cube lâche un peu en décalé
          landT: -1, done: false
        });
      }
    });

    // 5. un seul objet pour tous les cubes
    const m = d.glow ? new THREE.MeshBasicMaterial() : new THREE.MeshStandardMaterial({ roughness: 0.9 });
    this.imesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), m, this.cubes.length);
    this.imesh.frustumCulled = false;
    this.cubes.forEach((c, i) => this.imesh.setColorAt(i, c.color));
    this.imesh.instanceColor.needsUpdate = true;
    this.el.sceneEl.object3D.add(this.imesh);
    this.step(0);
  },

  step: function (dt) {
    const d = this.data, s = dt / 1000, t = this.t, dm = this.dummy;
    let alive = 0;

    // l'objet d'origine disparaît au moment où son morceau se brise
    this.pieces.forEach((p) => {
      if (!p.hidden && t >= p.start) { p.mesh.visible = false; p.hidden = true; }
    });

    for (let i = 0; i < this.cubes.length; i++) {
      const c = this.cubes[i];
      let sc = 0;
      if (!c.done) {
        alive++;
        if (t >= c.piece.start) {
          sc = c.s;
          if (t >= c.fall && c.landT < 0) {          // en chute
            c.vy -= d.gravity * s;
            c.x += c.vx * s; c.y += c.vy * s; c.z += c.vz * s;
            const ground = d.floor + c.s / 2;
            if (c.y <= ground) { c.y = ground; c.landT = t; }
          }
          if (c.landT >= 0) {                        // au sol, puis rétrécit
            const k = (t - c.landT - d.linger) / 400;
            if (k >= 1) { c.done = true; sc = 0; }
            else if (k > 0) sc = c.s * (1 - k);
          }
        }
      }
      dm.position.set(c.x, c.y, c.z);
      dm.rotation.set(0, c.yaw, 0);
      dm.scale.setScalar(sc);
      dm.updateMatrix();
      this.imesh.setMatrixAt(i, dm.matrix);
    }
    this.imesh.instanceMatrix.needsUpdate = true;

    if (alive === 0) {
      this.finished = true;
      this.imesh.visible = false;
      this.el.emit('disintegrated');
    }
  },

  tick: function (time, dt) {
    if (this.finished) return;
    this.t += dt;
    this.step(dt);
  },

  remove: function () {
    // removeAttribute remet l'objet d'origine
    (this.pieces || []).forEach((p) => { p.mesh.visible = true; });
    if (this.imesh) {
      this.el.sceneEl.object3D.remove(this.imesh);
      this.imesh.geometry.dispose();
      this.imesh.material.dispose();
    }
  }
});
  </script>
