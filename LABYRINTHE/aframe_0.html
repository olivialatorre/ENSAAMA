<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene
      keyboard-shortcuts=""
      screenshot=""
      xr-mode-ui=""
      device-orientation-permission-ui=""
    >
      <a-assets>
        <img id="texture" src="./pluie2.jpg" />

        <img
          id="earth_atmos_4096"
          src="https://aframe.io/sample-assets/assets/images/space/earth_atmos_4096.jpg"
          crossorigin="anonymous" /><img
          id="lensflare0"
          src="https://aframe.io/sample-assets/assets/images/particles/lensflare_rome/lensflare0.png"
          crossorigin="anonymous" /><img
          id="lensflare3"
          src="https://aframe.io/sample-assets/assets/images/particles/lensflare_rome/lensflare3.png"
          crossorigin="anonymous" /><img
          id="water"
          src="https://aframe.io/sample-assets/assets/images/noise/water.jpg"
          crossorigin="anonymous" /><img
          id="metal"
          src="https://aframe.io/sample-assets/assets/images/reflection/metal.jpg"
          crossorigin="anonymous" /><img
          id="perlin512"
          src="https://aframe.io/sample-assets/assets/images/noise/perlin-512.png"
          crossorigin="anonymous"
      /></a-assets>

      <a-entity
        camera
        look-controls
        wasd-controls="acceleration:20"
        dynamic-body="shape: sphere; sphereRadius: 0.3"
        position="0 1.6 0"
      ></a-entity>

      <!-- mur exterieurs-->
      <a-box
        src="#texture"
        position="2 2.01 -3.002"
        rotation="0 90 0"
        geometry="depth: 0.1; height: 4; width: 4"
      ></a-box>
      <a-box
        src="#texture"
        position="2 -2.035 -3.001"
        rotation="0 90 180"
        geometry="depth: 0.1; height: 4; width: 4"
        material="opacity: 0.7"
      ></a-box>
      <a-box
        src="#texture"
        position="-2 2 -3.011"
        rotation="0 90 0"
        color="#4CC3D9"
        geometry="depth: 0.1; height: 4; width: 4"
        material="opacity: 0.85; color: #ffffff"
      ></a-box>
      <a-box
        src="#texture"
        position="0 2 -4.959"
        color="#4CC3D9"
        geometry="depth: 0.1; height: 4; width: 4"
        material="opacity: 0.85; color: #ffffff"
      ></a-box>

      <a-box
        src="#texture"
        position="-2 -2.025 -2.988"
        rotation="0 90 180"
        color="#4CC3D9"
        geometry="depth: 0.1; height: 4; width: 4"
        material="opacity: 0.41; color: #ffffff"
      ></a-box>
      <a-box
        src="#texture"
        position="0 -2.052 -4.949"
        color="#4CC3D9"
        geometry="depth: 0.1; height: 4; width: 4"
        material="opacity: 0.41; color: #ffffff"
        rotation="0 0 180"
      ></a-box>

      <!-- mur interieurs-->
      <a-box
        material="shader: flat; src: #perlin512"
        position="0 1.599 -2.332"
        rotation="29.999999999999996 29.999999999999996 29.999999999999996"
        static-body
      ></a-box
      ><a-box
        material="opacity: 0.38; shader: flat; src: #perlin512"
        position="0 -1.102 -2.41"
        rotation="-29.999999999999996 -29.999999999999996 -29.999999999999996"
      ></a-box>
      <a-box
        position="-1 1.924 -2.513"
        rotation="0 90 0"
        color="#4CC3D9"
        geometry="depth: 0.1; height: 4; width: 3"
        material="blending: none; color: #000000; src: #metal"
      ></a-box
      ><a-box
        position="-1 -2.044 -2.517"
        rotation="0 90 0"
        color="#4CC3D9"
        geometry="depth: 0.1; height: 4; width: 3"
        material="blending: none; color: #000000; src: #metal"
      ></a-box>

      <a-box
        position="0 1.964 -1.065"
        color="#4CC3D9"
        geometry="depth: 0.1; height: 4; width: 2"
        material="opacity: 0.76; blending: multiply; color: #FFF; roughness: 0; src: #texture"
      ></a-box
      ><a-box
        position="0 -2.064 -1.052"
        color="#4CC3D9"
        geometry="depth: 0.1; height: 4; width: 2"
        material="opacity: 0.76; blending: multiply; color: #FFF; roughness: 0; src: #texture"
        rotation="0 0 180"
      ></a-box>

      <a-box
        position="1 1.973 -2.504"
        color="#4CC3D9"
        geometry="depth: 0.1; height: 4; width: 3.01"
        material="blending: none; color: #000000"
        rotation="0 90 0"
      ></a-box
      ><a-box
        position="1 -2.012 -2.501"
        color="#4CC3D9"
        geometry="depth: 0.1; height: 4; width: 3.01"
        material="blending: none; color: #000000"
        rotation="0 90 0"
      ></a-box
      ><a-box
        position="0.691 1.967 -3.865"
        color="#4CC3D9"
        geometry="depth: 0.1; height: 4; width: 0.75"
        material="blending: none; color: #000000; src: #metal"
        rotation="0 29.999999999999996 0"
      ></a-box
      ><a-box
        position="0.684 -1.977 -3.86"
        color="#4CC3D9"
        geometry="depth: 0.1; height: 4; width: 0.75"
        material="blending: none; color: #000000; src: #metal"
        rotation="0 29.999999999999996 0"
      ></a-box
      ><a-box
        position="-0.706 1.947 -3.887"
        color="#4CC3D9"
        geometry="depth: 0.1; height: 4; width: 0.75"
        material="blending: none; color: #000000; src: #metal"
        rotation="0 -29.999999999999996 0"
      ></a-box
      ><a-box
        position="-0.722 -1.989 -3.88"
        color="#4CC3D9"
        geometry="depth: 0.1; height: 4; width: 0.75"
        material="blending: none; color: #000000; src: #metal"
        rotation="0 -29.999999999999996 0"
      ></a-box>

      <a-sky src="#texture" color="black" material="src: "></a-sky
      ><a-sky
        src="#texture"
        color="black"
        material="shader: portal; strokeColor: #232323"
      ></a-sky>
    </a-scene>
  </body>
</html>
