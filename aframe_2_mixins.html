<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
        <a-assets>
            <img src=";/assets/images/grass.jpg" id="texture">
            <a-mixin id="red cube" material="color: red"></a-mixin>
            <a-mixin id="blue cube" material="color: blue"></a-mixin>
            <a-mixin id="cube" color="white" geometry="primitive: box"></a-mixin>
        </a-assets>

        <a-entity position="2 2 2" mixin="red cube"></a-entity>
        <a-entity position="3 3 3" mixin="blue cube"></a-entity>
        <a-entity position="4 4 4" mixin="cube"></a-entity>
    </a-scene>
  </body>
</html>
